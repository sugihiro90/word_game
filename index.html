<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マッタンゴ - 3 ROUNDS WORD GAME</title>
    <style>
        html, body { overflow: hidden; height: 100%; width: 100%; margin: 0; padding: 0; overscroll-behavior-y: none; position: fixed; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #f0f4f8; color: #333; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; height: 90vh; display: flex; flex-direction: column; position: relative; box-sizing: border-box; overflow-y: auto; }
        .hidden { display: none; }
        button { background: #007bff; color: white; border: none; padding: 16px; font-size: 16px; border-radius: 12px; cursor: pointer; margin: 8px 0; width: 100%; font-weight: bold; transition: 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.outline { background: transparent; border: 2px solid #007bff; color: #007bff; }
        select, input { padding: 12px; font-size: 16px; width: 100%; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; background: white; box-sizing: border-box; }
        .setting-group { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; }
        .setting-label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        .team-tag { display: inline-block; padding: 5px 20px; border-radius: 20px; color: white; font-weight: bold; margin-bottom: 10px; }
        .team-a { background: #e67e22; }
        .team-b { background: #9b59b6; }
        .word-display { font-size: 28px; font-weight: bold; margin: 20px 0; min-height: 120px; display: flex; align-items: center; justify-content: center; border: 3px solid #eee; border-radius: 15px; background: #fff; padding: 10px; line-height: 1.2; user-select: none; -webkit-user-select: none; cursor: pointer; }
        .relay-msg { font-size: 20px; color: #d35400; font-weight: bold; margin: 15px 0; padding: 15px; background: #fff3cd; border-radius: 12px; border: 2px dashed #ffab00; }
        .stats-box { text-align: left; background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .stats-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #eee; }
    </style>
</head>
<body>

<div class="card">
    <div id="title-screen">
        <h1 style="color:#007bff; margin-top:40px; font-size: 42px;">マッタンゴ</h1>
        <button onclick="showScreen('setup-screen')">ゲームスタート</button>
    </div>

    <div id="setup-screen" class="hidden">
        <h2>ゲーム設定</h2>
        <div class="setting-group">
            <span class="setting-label">チーム人数</span>
            A: <select id="count-a"></select> B: <select id="count-b"></select>
        </div>
        <div class="setting-group">
            <span class="setting-label">1人あたりの単語数</span>
            <select id="words-count"></select>
        </div>
        <button onclick="initPlayers()">次へ</button>
    </div>

    <div id="input-screen" class="hidden">
        <div id="input-team-tag" class="team-tag"></div>
        <h2 id="input-user-title"></h2>
        <input type="text" id="user-name" placeholder="名前">
        <div id="word-inputs-container"></div>
        <button id="save-btn" onclick="saveCurrentPlayer()">登録して次へ</button>
    </div>

    <div id="ready-screen" class="hidden">
        <div id="current-team-tag" class="team-tag"></div>
        <h2 id="round-info"></h2>
        <div id="interim-score" style="margin:10px 0; font-weight:bold;"></div>
        <div class="relay-msg">次は <strong id="next-player-name"></strong> さん！</div>
        <button onclick="startTurn()">スタート！</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="game-team-tag" class="team-tag"></div>
        <div>残り: <span id="time-left"></span>秒 | あと <span id="remaining-words-count"></span>個</div>
        <div id="relay-overlay" class="hidden">
            <div class="relay-msg">正解！次は <strong id="relay-to-name"></strong> さん！</div>
            <button onclick="showNextWord()">受け取った！</button>
        </div>
        <div id="word-area">
            <p>出題者: <strong id="current-speaker-name"></strong></p>
            <div class="word-display" id="current-word"></div>
            <div id="action-buttons" class="hidden">
                <button style="background:#28a745;" onclick="correctAnswer(event)">正解！</button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h1 id="winner-text"></h1>
        <div id="final-scores"></div>
        <div id="player-ranking" class="stats-box"></div>
        <button onclick="location.reload()">最初から</button>
    </div>
</div>

<script>
    let playersA = [], playersB = [], allWordObjects = [], solveRecords = [];
    let currentPool = [], scores = {A:0, B:0}, round = 1;
    let turnTeam = 'A', indexA = 0, indexB = 0;
    let timer, timeLeft, startTime;

    const roundData = [
        { name: "Round 1: 説明", time: 60 },
        { name: "Round 2: 一単語", time: 30 },
        { name: "Round 3: ジェスチャー", time: 30 }
    ];

    function createOptions(id, min, max, def) {
        const sel = document.getElementById(id);
        for(let i=min; i<=max; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.text = i + (id==='words-count'?'個':'人');
            if(i===def) opt.selected = true;
            sel.appendChild(opt);
        }
    }
    createOptions('count-a', 2, 10, 2);
    createOptions('count-b', 2, 10, 2);
    createOptions('words-count', 1, 5, 3);

    function showScreen(id) {
        document.querySelectorAll('.card > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function initPlayers() {
        playersA = []; playersB = []; allWordObjects = []; scores = {A:0, B:0}; round = 1; indexA = 0; indexB = 0;
        showInputFor('A', 0);
    }

    function showInputFor(team, idx) {
        const count = parseInt(document.getElementById('count-' + team.toLowerCase()).value);
        if (idx >= count) {
            if (team === 'A') return showInputFor('B', 0);
            else { currentPool = []; return startRoundSetup(true); }
        }
        document.getElementById('input-team-tag').innerText = team + "チーム";
        document.getElementById('input-team-tag').className = "team-tag team-" + team.toLowerCase();
        document.getElementById('input-user-title').innerText = `プレイヤー ${idx + 1}`;
        document.getElementById('user-name').value = `${team}チーム${idx+1}`;
        const container = document.getElementById('word-inputs-container');
        container.innerHTML = "";
        const wCount = document.getElementById('words-count').value;
        for(let i=0; i<wCount; i++) {
            const inp = document.createElement('input');
            inp.placeholder = `単語 ${i+1}`;
            inp.className = "word-input";
            container.appendChild(inp);
        }
        showScreen('input-screen');
    }

    function saveCurrentPlayer() {
        const team = document.getElementById('input-team-tag').innerText.includes('A') ? 'A' : 'B';
        const name = document.getElementById('user-name').value.trim();
        const words = document.querySelectorAll('.word-input');
        if (team === 'A') playersA.push(name); else playersB.push(name);
        words.forEach(w => allWordObjects.push({text: w.value.trim(), author: name}));
        showInputFor(team, (team === 'A' ? playersA : playersB).length);
    }

    function startRoundSetup(isNewRound = false) {
        if (round > 3) return showFinalResults();
        if (isNewRound && round > 1 && scores.A !== scores.B) turnTeam = (scores.A < scores.B) ? 'A' : 'B';
        if (isNewRound) currentPool = [...allWordObjects];
        shuffle(currentPool);
        document.getElementById('next-player-name').innerText = (turnTeam === 'A') ? playersA[indexA] : playersB[indexB];
        document.getElementById('round-info').innerText = roundData[round-1].name;
        document.getElementById('interim-score').innerText = `現在 A:${scores.A} B:${scores.B}`;
        showScreen('ready-screen');
    }

    function startTurn() {
        showScreen('game-screen');
        timeLeft = roundData[round-1].time;
        document.getElementById('time-left').innerText = timeLeft;
        updateWordCount();
        showNextWord();
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('time-left').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                alert("タイムアップ！");
                turnTeam = (turnTeam === 'A') ? 'B' : 'A';
                startRoundSetup(false);
            }
        }, 1000);
    }

    function updateWordCount() { document.getElementById('remaining-words-count').innerText = currentPool.length; }

    function showNextWord() {
        if (currentPool.length === 0) { clearInterval(timer); round++; return startRoundSetup(true); }
        document.getElementById('relay-overlay').classList.add('hidden');
        document.getElementById('word-area').classList.remove('hidden');
        document.getElementById('current-speaker-name').innerText = (turnTeam === 'A') ? playersA[indexA] : playersB[indexB];
        setWordHiddenState();
        document.getElementById('action-buttons').classList.add('hidden');
    }

    function setWordHiddenState() {
        const wordDisplay = document.getElementById('current-word');
        wordDisplay.innerHTML = `<button class="outline">タップして表示</button>`;
        wordDisplay.onclick = () => revealWord();
    }

    function revealWord() {
        startTime = Date.now();
        const wordDisplay = document.getElementById('current-word');
        wordDisplay.innerHTML = `<span>${currentPool[0].text}</span>`;
        document.getElementById('action-buttons').classList.remove('hidden');
        wordDisplay.onclick = () => setWordHiddenState();
    }

    function correctAnswer(e) {
        e.stopPropagation(); // 枠のクリックイベント（隠す）が発動しないようにする
        const duration = (Date.now() - startTime) / 1000;
        solveRecords.push({ solver: (turnTeam === 'A' ? playersA[indexA] : playersB[indexB]), time: duration });
        scores[turnTeam]++;
        currentPool.shift();
        if (currentPool.length === 0) { clearInterval(timer); alert("全単語終了！"); round++; startRoundSetup(true); return; }
        updateWordCount();
        if (turnTeam === 'A') indexA = (indexA + 1) % playersA.length; else indexB = (indexB + 1) % playersB.length;
        document.getElementById('relay-to-name').innerText = (turnTeam === 'A') ? playersA[indexA] : playersB[indexB];
        document.getElementById('relay-overlay').classList.remove('hidden');
        document.getElementById('word-area').classList.add('hidden');
    }

    function showFinalResults() {
        showScreen('result-screen');
        document.getElementById('winner-text').innerText = scores.A > scores.B ? "Aチーム勝利！" : "Bチーム勝利！";
        document.getElementById('final-scores').innerText = `A: ${scores.A}点 | B: ${scores.B}点`;
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
</script>
</body>
</html>
